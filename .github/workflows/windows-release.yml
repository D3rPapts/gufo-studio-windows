name: Windows release

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: Optional TheRock tarball to pin (default the validated release pin)
        required: false
        default: ""
      publish:
        description: Publish the build to the checked-out commit's own release
        type: boolean
        required: false
        default: true
  push:
    branches:
      - feature/window-native
    tags:
      - "windows-v*"

permissions:
  contents: write
  issues: write

concurrency:
  group: windows-release
  # Serialise builds instead of cancelling: every branch push is promised
  # its own release, so a build overtaken by a newer push must still finish
  # and publish rather than being dropped.
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Check which paths a branch push touched
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Branch pushes that only touch CI/docs paths cannot change the
          # binary, so they skip the build entirely: a fork does not need a
          # 45-minute runner burn and a 358 MB release per README tweak.
          # Anything unclear fails open and builds. Tag pushes and manual
          # runs always build.
          set -euo pipefail
          build=true
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = branch ] \
             && [ -n "$BEFORE" ] && ! grep -qE '^0+$' <<< "$BEFORE"; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" \
                      --jq '.files[].filename' 2>/dev/null || true)
            count=$(printf '%s\n' "$files" | wc -l)
            # The compare endpoint caps its file list at 300; a truncated
            # list may be hiding a real change, so build.
            if [ -n "$files" ] && [ "$count" -lt 300 ] \
               && ! printf '%s\n' "$files" | grep -qvE '^(\.github/|docs/)|\.md$'; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  windows-release:
    name: Build and package Windows release
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SDK_ROOT: C:/TheRock/build
      BUILD_DIR: build\windows-release
      # The tarball published builds ship from. Nightly 10.2.0a* compiles
      # binaries that run ~100x slower on gfx1151 (issue #1), and the
      # nightly index purges tarballs after ~6 weeks, so published builds
      # use a validated stable SDK mirrored on this repository's
      # toolchain/therock-* releases. Bump the pin only after validating a
      # new SDK end to end on device (see BUILD-WINDOWS.md).
      PINNED_SDK: therock-dist-windows-gfx1151-10.0.0.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify this is the Windows port branch
        shell: pwsh
        run: |
          if ((Get-Content CMakePresets.json -Raw) -notmatch '"windows-release"') {
            throw "CMakePresets.json has no windows-release preset; this checkout is not the Windows port. Run this workflow on the feature/window-native branch (or a windows-v* tag pointing at it)."
          }

      - name: Resolve TheRock SDK
        id: sdk
        env:
          SDK_OVERRIDE: ${{ github.event.inputs.sdk }}
        shell: pwsh
        run: |
          if ($env:SDK_OVERRIDE) {
            # A manual run explicitly chose a tarball.
            $tarball = $env:SDK_OVERRIDE
          } else {
            # Published builds ship from the validated pin, not the newest
            # nightly: nightly 10.2.0a20261005 compiled binaries that ran
            # ~100x slower on gfx1151 (issue #1), and a --version smoke test
            # cannot catch that.
            $tarball = $env:PINNED_SDK
          }
          "tarball=$tarball" >> $env:GITHUB_OUTPUT
          "version=$($tarball -replace '^therock-dist-windows-gfx1151-', '' -replace '\.tar\.gz$', '')" >> $env:GITHUB_OUTPUT

      - name: Download TheRock HIP SDK
        env:
          SDK_TARBALL: ${{ steps.sdk.outputs.tarball }}
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\sdk.tar.gz"
          $amdUrl = "https://nightly.repo.amd.com/rocm/core/tarball/$env:SDK_TARBALL"
          curl.exe --fail --location --retry 3 --output "$out" "$amdUrl"
          if ($LASTEXITCODE -eq 0) { exit 0 }
          # The pin may have aged off AMD's ~6-week nightly index; fall back
          # to this repository's toolchain mirror release.
          $version = $env:SDK_TARBALL -replace '^therock-dist-windows-gfx1151-', '' -replace '\.tar\.gz$', ''
          $mirrorUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/toolchain/therock-$version/$env:SDK_TARBALL"
          curl.exe --fail --location --retry 3 --output "$out" "$mirrorUrl"
          if ($LASTEXITCODE -ne 0) { throw "curl failed with exit code $LASTEXITCODE for both $amdUrl and $mirrorUrl" }

      - name: Extract TheRock HIP SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:SDK_ROOT | Out-Null
          tar -xzf "$env:RUNNER_TEMP\sdk.tar.gz" -C $env:SDK_ROOT
          Remove-Item "$env:RUNNER_TEMP\sdk.tar.gz" -Force
          foreach ($path in @(
              "$env:SDK_ROOT\lib\llvm\bin\clang-cl.exe",
              "$env:SDK_ROOT\bin\hipcc.exe",
              "$env:SDK_ROOT\bin\rocblas\library",
              "$env:SDK_ROOT\bin\hipblaslt\library"
            )) {
            if (-not (Test-Path $path)) {
              throw "TheRock SDK is missing $path; the tarball layout may have changed"
            }
          }

      - name: Patch SDK HIP math headers for MSVC
        shell: pwsh
        run: python tools/windows/patch_sdk_math.py "C:/TheRock/build"

      - name: Set up MSVC x64 environment
        shell: pwsh
        run: |
          # Export the vcvars64 environment into later steps. This replaces
          # the ilammy/msvc-dev-cmd action, whose Node 20 runtime triggers a
          # deprecation annotation and which has no Node 24 release.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with the x64 VC toolset was found' }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $before = @{}
          foreach ($line in (cmd /s /c 'set')) {
            if ($line -match '^([^=]+)=(.*)$') { $before[$Matches[1]] = $Matches[2] }
          }
          foreach ($line in (cmd /s /c "call `"$bat`" >NUL 2>&1 && set")) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            if ($before.ContainsKey($Matches[1]) -and $before[$Matches[1]] -eq $Matches[2]) { continue }
            Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
          }

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          ninja --version

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          # vcvars points VCPKG_ROOT at the VS-bundled copy, which is not a
          # full git clone; a fresh clone keeps the manifest baseline
          # resolvable and the dependency versions deterministic.
          if (Test-Path C:\vcpkg) { Remove-Item -Recurse -Force C:\vcpkg }
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          # Hand CMake the HIP root explicitly and put the SDK's bin on
          # PATH: CMake 4.4 cannot discover it by itself for some TheRock
          # layouts (neither the compiler's "Found HIP installation"
          # self-report nor hipconfig is reachable), which failed the first
          # 10.0.0 release build at enable_language(HIP).
          $env:PATH = "$env:SDK_ROOT\bin;$env:PATH"
          $toolchain = "$($env:VCPKG_ROOT -replace '\\', '/')/scripts/buildsystems/vcpkg.cmake"
          cmake --preset windows-release "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DCMAKE_HIP_COMPILER_ROCM_ROOT=$env:SDK_ROOT"

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload configure and build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmake-logs-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stage Tensile kernel libraries
        shell: pwsh
        run: |
          Copy-Item "C:\TheRock\build\bin\rocblas"   "$env:BUILD_DIR" -Recurse -Force
          Copy-Item "C:\TheRock\build\bin\hipblaslt" "$env:BUILD_DIR" -Recurse -Force

      - name: Smoke test
        shell: pwsh
        run: |
          & ".\$env:BUILD_DIR\gufo.exe" --version

      - name: Package
        id: package
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          # The short commit in the name and tag makes each push's build a
          # distinct release that is never replaced by a later one.
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "gufo-$version-windows-gfx1151-$sha"
          # Every build publishes its own release: branch pushes and manual
          # runs tag windows-v<version>-<sha>, tag pushes use their own tag.
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
                 else { "windows-v$version-$sha" }
          $pkg = "$env:RUNNER_TEMP\$name"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$env:BUILD_DIR\gufo.exe" $pkg
          Copy-Item "$env:BUILD_DIR\gufo-server.exe" $pkg
          Copy-Item "$env:BUILD_DIR\*.dll" $pkg
          Copy-Item "$env:BUILD_DIR\rocblas" $pkg -Recurse
          Copy-Item "$env:BUILD_DIR\hipblaslt" $pkg -Recurse
          # gufo.exe imports the MSVC CRT and the LLVM OpenMP runtime, and
          # libomp140.x86_64.dll only comes with Visual Studio: ship them
          # app-local so the archive runs on a machine without either
          # (provenance in tools/windows/redist/README.md).
          Copy-Item "tools/windows/redist/*.dll" $pkg
          # Package with .NET's ZipFile writer, not `tar --format zip`:
          # bsdtar marks every file entry with the streaming data-descriptor
          # flag (general-purpose bit 3), which Windows Explorer's zip
          # handler refuses — the shell namespace shows the archive as empty
          # and Extract All fails on Windows 11. .NET writes seekable
          # entries without descriptors; `tar -tf` still reads the result.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path "$pkg.zip") { Remove-Item "$pkg.zip" -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($pkg, "$pkg.zip", [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $entries = tar -tf "$pkg.zip"
          foreach ($required in @('gufo.exe', 'gufo-server.exe', 'MIOpen.dll',
                                  'libomp140.x86_64.dll', 'vcruntime140.dll',
                                  'vcruntime140_1.dll', 'msvcp140.dll',
                                  'msvcp140_atomic_wait.dll',
                                  'rocblas/library/', 'hipblaslt/library/')) {
            if (-not ($entries | Where-Object { $_ -like "*$required*" })) {
              throw "package is missing $required"
            }
          }
          if ($entries | Where-Object { $_ -like '*\*' -or $_ -like './' -or $_ -like './*' }) {
            throw "package contains backslash or ./-prefixed entry names"
          }
          @"
          Native Windows build of Gufo for AMD Strix Halo (Ryzen AI Max+ 395, gfx1151).

          - Gufo $version (commit $env:GITHUB_SHA)
          - Built with TheRock HIP SDK $env:SDK_VERSION

          The asset name carries the short commit hash so builds are distinguishable. Branch pushes and manual runs publish one release per commit (tagged ``windows-v<version>-<sha>``) and earlier releases are kept; ``windows-v*`` tags publish pinned snapshots.

          Unzip the archive and run ``gufo.exe`` from the extracted folder (``gufo-server.exe`` starts the OpenAI-compatible HTTP server). An AMD graphics driver with ROCm support is required; the build targets gfx1151 only. See BUILD-WINDOWS.md in the repository for build-from-source instructions.
          "@ | Out-File -FilePath "$env:RUNNER_TEMP\release-notes.md" -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=$pkg.zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          retention-days: 30

      - name: Publish release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Branch pushes and manual runs publish a release per commit
          # (windows-v<version>-<sha>) and keep earlier ones; tag pushes
          # publish pinned windows-vX.Y.Z snapshots.
          tag_name: ${{ steps.package.outputs.release_tag }}
          files: ${{ steps.package.outputs.zip }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: "true"

      - name: Close the build-failure issue after a good run
        if: ${{ success() }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $open = gh issue list --repo $env:GITHUB_REPOSITORY --state open `
            --search '"Windows release build is failing" in:title' --json number |
            ConvertFrom-Json
          foreach ($issue in $open) {
            gh issue close $issue.number --repo $env:GITHUB_REPOSITORY `
              --comment "Latest run succeeded: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }

      - name: Open an issue when the build breaks
        if: ${{ failure() }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $open = gh issue list --repo $env:GITHUB_REPOSITORY --state open `
            --search '"Windows release build is failing" in:title' --json number |
            ConvertFrom-Json
          if ($open.Count -eq 0) {
            $body = @"
          The Windows release workflow failed. Previously published releases are unaffected; only builds from this commit onward are missing until this is fixed.

          - Failed run: $env:RUN_URL
          - Commit: $env:GITHUB_SHA

          Common causes: a broken or pulled nightly SDK (re-run with the ``sdk`` input pinned to a known-good tarball from https://nightly.repo.amd.com/rocm/core/tarball/), a compile break on the port branch, or a vcpkg dependency change.
          "@
            gh issue create --repo $env:GITHUB_REPOSITORY `
              --title 'Windows release build is failing' --body $body
          }
