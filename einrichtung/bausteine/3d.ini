# baustein: 3d
# modell: triposg
# TripoSG (MIT) on the separate 3D build: image -> GLB mesh as a job. POST /v1/3d/generations {model, image, steps,
# guidance, seed, resolution 256|512, max_faces}; page /objekt/. Measured: peak 6.7 GB GPU, 116 s per object (512^3).
[external/triposg]
command = {app_3d}\gufo.exe
args = serve objekt
model = {modelle}\VAST-AI\TripoSG\gufo\triposg.safetensors
root = {daten}\jobs\objekt
ttl = 86400
served-model-name = triposg
max-request-bytes = 33554432
router-gpu-gb = 8
router-host-gb = 4
router-idle-seconds = 900

# baustein: 3d
# modell: trellis2
# TRELLIS.2-4B (MIT; image encoder DINOv3 under the Meta DINOv3 License, "Built with DINOv3") on the separate
# TRELLIS build: image -> GLB with vertex colours, 512 path, 12 steps. Measured: peak 19.3 GB GPU with texture.
[external/trellis2]
command = {app_trellis2}\gufo.exe
args = serve objekt
trellis2 = {modelle}\microsoft\gufo-trellis2
trellis2-texture = true
root = {daten}\jobs\trellis2
ttl = 86400
served-model-name = trellis2
max-request-bytes = 33554432
router-gpu-gb = 20
router-host-gb = 3
router-idle-seconds = 900
