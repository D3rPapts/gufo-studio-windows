# baustein: bilder
# modell: qwen-image-2.1
# Qwen-Image-2.1 (Qwen Research License: non-commercial). 1024x1024 / 40 steps about 110-150 s, 512x512 about 22 s.
# The worker holds 22-37 GB GPU memory between jobs, so it is unloaded after 180 s idle (router-idle-seconds).
# LoRA adapters: ONE lora line, entries separated by ';' (two lora lines = "duplicate option: --lora", the worker
# does not start). Requests pick them by name: "loras":[{"name":"...","scale":0.8}].
[external/qwen-image-2.1]
command = {app}\gufo.exe
args = serve image
model = {modelle}\Qwen\Qwen-Image-2.1
served-model-name = qwen-image-2.1
max-request-bytes = 67108864
router-idle-seconds = 180
lora = {lora_qwen_image?}

# baustein: bilder
# modell: qwen-image-2.1-turbo
# Qwen-Image-2.1 Turbo: fixed 8-step schedule (1024x1024 23 s vs 111 s base), same GPU peak as the base.
# Its text_encoder folder is identical to Qwen-Image-2.1's (hardlinks are enough). Same license.
[external/qwen-image-2.1-turbo]
command = {app}\gufo.exe
args = serve image
model = {modelle}\Qwen\Qwen-Image-2.1-Turbo
served-model-name = qwen-image-2.1-turbo
max-request-bytes = 67108864
router-idle-seconds = 180

# baustein: bilder
# modell: moss-image
# MOSS-Image SFT (Apache-2.0, no content filter). 1024x1024 / 50 steps about 200-260 s. 2.0: no text-encoder option;
# the worker reads <model>\text_encoder.gguf (copy or hardlink of text_encoder-bf16.gguf).
[external/moss-image]
command = {app}\gufo.exe
args = serve image
model = {modelle}\OpenMOSS-Team\MOSS-Image-SFT
served-model-name = moss-image
max-request-bytes = 67108864
router-idle-seconds = 180
