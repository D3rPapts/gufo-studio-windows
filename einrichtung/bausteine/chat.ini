# baustein: chat
# modell: qwen3.8-27b
# Qwen3.8-27B UD-Q4_K_XL with the DFlash2 draft and the image projector. DFlash2 adapts its draft length (no
# draft-tokens line in 2.0). Prompt cache: 1 GiB in RAM (4 GiB left a 64 GB machine ~0.1 GB headroom), 32 GiB on disk.
[external/qwen3.8-27b]
command = {app}\gufo.exe
args = serve llm
model = {modelle}\unsloth\Qwen3.8-27B-GGUF\Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = {modelle}\unsloth\Qwen3.8-27B-GGUF\mmproj-BF16.gguf
served-model-name = qwen3.8-27b
context = 155648
speculative = dflash2
dflash-model = {modelle}\z-lab\Qwen3.8-27B-DFlash2-GGUF\Qwen3.8-27B-DFlash2-Q4_K_M.gguf
repeat-penalty = 1.05
max-request-bytes = 67108864
cache-ram-bytes = 1073741824
cache-disk = {daten}\prompt-cache
cache-disk-bytes = 34359738368

# baustein: chat
# modell: qwen3.8-flash-next-q3
# Qwen3.8-Flash-Next UD-Q3_K_XL (90 GB): routed experts stream from the GGUF into a 24 GB GPU cache; the rest is read
# from the SSD per MoE step. Measured on a 64 GB machine: 24-29 tok/s writing (2.0.1/2.0.2 checks). No expert profile
# (flash-next.prof was recorded with the Q4 model). 2.0: 26 GB + RAM cache did not start on 64 GB; 24 GB + off did.
[external/qwen3.8-flash-next-q3]
command = {app}\gufo.exe
args = serve llm
model = {modelle}\unsloth\Qwen3.8-Flash-Next-GGUF\UD-Q3_K_XL\Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
served-model-name = qwen3.8-flash-next-q3
context = 32768
speculative = mtp
mtp-model = {modelle}\unsloth\Qwen3.8-Flash-Next-GGUF\MTP\mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
expert-cache-bytes = 24000000000
cache-ram-bytes = off
cache-disk = {daten}\prompt-cache-flashnext-q3
cache-disk-bytes = 17179869184
max-request-bytes = 67108864

# baustein: chat
# modell: qwen3.8-flash-next
# Qwen3.8-Flash-Next UD-Q4_K_XL (111 GB), same streaming as Q3. Measured on a 64 GB machine: 14.2-15.7 tok/s with the
# 24 GB cache; loading needs ~8.5 GB free host RAM (2.0.2). The 128 GB machine (.56) runs the same values; a larger
# cache on 128 GB is not measured by us, so the values are the same for both sizes. The expert profile preloads the
# most routed experts at start-up (data file, copied from the .198).
[external/qwen3.8-flash-next]
command = {app}\gufo.exe
expert-profile = {daten}\expert-profiles\flash-next.prof
args = serve llm
model = {modelle}\unsloth\Qwen3.8-Flash-Next-GGUF\UD-Q4_K_XL\Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
served-model-name = qwen3.8-flash-next
context = 32768
speculative = mtp
mtp-model = {modelle}\unsloth\Qwen3.8-Flash-Next-GGUF\MTP\mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
expert-cache-bytes = 24000000000
cache-ram-bytes = off
cache-disk = {daten}\prompt-cache-flashnext
cache-disk-bytes = 17179869184
max-request-bytes = 67108864

