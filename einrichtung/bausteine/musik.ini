# baustein: musik
# modell: ace-step-1.5-xl-turbo
# ACE-Step 1.5 XL turbo (MIT): POST /v1/audio/music -> WAV 48 kHz stereo (mp3/m4a too). 30 s with the 5 Hz LM ~22 s,
# without ~2 s; GPU 10.7 GB idle, ~15 GB peak. The folder holds the converted weights (dit*, lm*, vae, text_encoder).
[external/ace-step-1.5-xl-turbo]
command = {app}\gufo.exe
args = serve music
model = {modelle}\ACE-Step\gufo
served-model-name = ace-step-1.5-xl-turbo

# baustein: musik
# modell: ace-step-1.5-xl-sft
# ACE-Step 1.5 XL sft: 50 steps + APG guidance 7 (about twice the turbo time), 5 Hz planner 1.7B. Tasks: text2music,
# repaint, cover. router-gpu-gb/host-gb are the turbo values from the learned memory file.
[external/ace-step-1.5-xl-sft]
command = {app}\gufo.exe
args = serve music --dit sft --lm 1.7b
model = {modelle}\ACE-Step\gufo
served-model-name = ace-step-1.5-xl-sft
max-request-bytes = 67108864
router-gpu-gb = 15
router-host-gb = 1.5

# baustein: musik
# modell: ace-step-1.5-xl-base
# ACE-Step 1.5 XL base: 32 steps + APG 7; also extract, lego, complete (stems).
[external/ace-step-1.5-xl-base]
command = {app}\gufo.exe
args = serve music --dit base --lm 1.7b
model = {modelle}\ACE-Step\gufo
served-model-name = ace-step-1.5-xl-base
max-request-bytes = 67108864
router-gpu-gb = 15
router-host-gb = 1.5

# baustein: musik
# modell: moss-music-8b
# MOSS-Music-8B-Instruct (Apache-2.0 per model card) on the separate MOSS build: rates music. Same API as the Omni
# captioner (chat completion with input_audio). GPU ~10.6 GB at context 4096; unloaded after 300 s idle.
[external/moss-music]
command = {app_moss}\gufo.exe
args = serve moss-music
model = {modelle}\OpenMOSS-Team\moss-music-gufo\moss-music-8b.llm-Q8_0.gguf
audio-gguf = {modelle}\OpenMOSS-Team\moss-music-gufo\moss-music-8b.audio.gguf
context = 4096
max-tokens = 1024
served-model-name = moss-music-8b
max-request-bytes = 67108864
router-gpu-gb = 12
router-host-gb = 1
router-idle-seconds = 300
