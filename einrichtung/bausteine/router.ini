# baustein: router
# gufo-studio-windows router preset, written by einrichtung\einrichten.py {einrichtung_version} on {zeit}
# for machine "{rechner}" ({ram} GB). Do not edit the "# baustein:" / "# modell:" markers: einrichten.py adds and
# removes sections by them. Everything else may be edited; re-running einrichten.py keeps sections it does not own.
# The [router] section at the end carries only users and access control (2.0.3+); the start line and the
# environment below are what einrichten.py writes into start-router.cmd.
# start: {app}\gufo.exe router --models-preset "{preset}" --models-max 0 --sleep-idle-seconds {idle_seconds} --memory-guard --memory-reserve-host-gb 2 --load-timeout-seconds 600 --host {host} --port {port} --max-request-bytes 67108864 --pages-dir "{pages}" --jobs-dir "{daten}\jobs" --jobs-webhook-allow {webhook_allow} --jobs-parallel 2
# start-opt: --comfy-dir "{comfy_dir?}"
# start-opt: --comfy-ffmpeg "{comfy_ffmpeg?}"
# start-opt: --names-file "{names_file?}"
# start-opt: --remote-allow {partner_ip?}
# env: GUFO_HOST_RESERVE_MIB={reserve}
# env: GUFO_QWEN_IMAGE_FLASH_ATTENTION=1
# env: GUFO_QWEN27_LOOKUP=7
# env: GUFO_QWEN27_LOOKUP_GENERATED=1
# env: GUFO_QWEN27_LOOKUP_MIN=12
# env: GUFO_QWEN27_LOOKUP_MIN_REASONING=24
# env: GUFO_QWEN27_LOOKUP_MIN_ANSWER=6
# GUFO_HOST_RESERVE_MIB=2048 is measured on a 64 GB machine (2.0: Flash-Next with 26 GB cache + RAM prompt cache did not
# start; 24 GB + cache-ram-bytes off + 2048 MiB reserve did). The GUFO_QWEN27_LOOKUP values are the production
# knobs of the .198 (measured 34.2 vs 31.5 tok/s). Memory peaks are learned into <preset>.memory.json.
# Users and access control (2.1 setup assistant, decision 13.11.2026): "heimnetz" = auth = lan with the machine
# itself as admin (the admin account is required then); "nur-dieser-rechner" = auth = off (an admin account is
# optional). The users file is nutzer\nutzer.json next to this preset (the router's default).
[router]
#@heimnetz auth = lan
#@heimnetz auth-loopback = admin
#@nur-dieser-rechner auth = off
