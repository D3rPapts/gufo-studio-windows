# baustein: stimme
# modell: qwen3-tts
# Qwen3-TTS 1.7B CustomVoice: voices aiden, dylan, eric, ono_anna, ryan, serena, sohee, uncle_fu, vivian; German via
# "language":"german". About 2x realtime.
[external/qwen3-tts]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\Qwen\Qwen3-TTS-12Hz-1.7B-CustomVoice
served-model-name = qwen3-tts
max-request-bytes = 67108864

# baustein: stimme
# modell: qwen3-tts-voicedesign
# Qwen3-TTS 1.7B VoiceDesign: the voice comes from "instructions" (free text).
[external/qwen3-tts-voicedesign]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\Qwen\Qwen3-TTS-12Hz-1.7B-VoiceDesign
served-model-name = qwen3-tts-voicedesign
max-request-bytes = 67108864

# baustein: stimme
# modell: qwen3-tts-clone
# Qwen3-TTS 1.7B Base: voice cloning. Preset voices from {daten}\voices (WAV + .txt transcript beside it); requests
# may also send reference_audio (base64 WAV) + reference_text. The voice lines need the "stimmen_vorlage" switch.
[external/qwen3-tts-clone]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\Qwen\Qwen3-TTS-12Hz-1.7B-Base
served-model-name = qwen3-tts-clone
#@stimmen_vorlage voice = erzaehler={daten}\voices\erzaehler.wav
#@stimmen_vorlage voice-lang = erzaehler=german
max-request-bytes = 67108864

# baustein: stimme
# modell: qwen3-asr-1.7b
# Qwen3-ASR 1.7B: POST /v1/audio/transcriptions, response_format json | text | srt | vtt | verbose_json. WAV up to 30 min.
[external/qwen3-asr-1.7b]
command = {app}\gufo.exe
args = serve asr
model = {modelle}\Qwen\Qwen3-ASR-1.7B
served-model-name = qwen3-asr-1.7b
max-request-bytes = 67108864

# baustein: stimme
# modell: fish-drama-3
# Fish Audio Drama-3 (Fish Audio Community License 1.0: commercial use only under 500k USD annual revenue).
# 38.6 GB GPU when loaded: does not fit beside the 27B on a 64 GB machine.
[external/fish-drama-3]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\fishaudio\drama-3
served-model-name = fish-drama-3
max-request-bytes = 67108864

# baustein: stimme
# modell: indextts-2.5-german
# IndexTTS-2.5 German (bilibili licence), about 3 s per sentence. Cloning needs a CLEAN reference (10-15 s, quiet
# room, no reverb); a calm Fish Drama-3 rendering of the voice works well.
[external/indextts-2.5-german]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\IndexTeam\IndexTTS-2.5-german-bundle
served-model-name = indextts-2.5-german
#@stimmen_vorlage voice = erzaehler={daten}\voices\erzaehler-9s.wav
max-request-bytes = 67108864

# baustein: stimme
# modell: voxcpm2-tts
# VoxCPM2 (Apache-2.0), 48 kHz, voice clone (reference at most 10 s), emotion/instructions as free text. GPU RTF 0.82.
[external/voxcpm2-tts]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\openbmb\VoxCPM2
served-model-name = voxcpm2-tts
#@stimmen_vorlage voice = erzaehler={daten}\voices\erzaehler-9s.wav
max-request-bytes = 67108864

# baustein: stimme
# modell: ming-tts
# Ming-3.0-tts 0.5B (MIT), about 2.5x realtime, ~1.9 GB GPU. "emotion" (also German words), "instructions",
# reference_audio (+ reference_text). Reference voices must be at most about 10 s.
[external/ming-tts]
command = {app}\gufo.exe
args = serve tts
model = {modelle}\inclusionAI\Ming-3.0-tts-0.5B
served-model-name = ming-tts
#@stimmen_vorlage voice = erzaehler={daten}\voices\erzaehler-9s.wav
#@stimmen_vorlage voice-lang = erzaehler=german
max-request-bytes = 67108864

# baustein: stimme
# modell: gufo-voice-convert
# Seed-VC singing/voice conversion (GPL-3.0: internal use only, never in a public package), separate D-block build.
# POST /v1/audio/convert, /v1/audio/separate. threads 8 = CPU cap of the whole chain (32 cores reached 97.6 C).
# Host RAM ~1.5 GB plus RMVPE weights while loading, so router-host-gb 4; unloaded after 120 s idle.
[external/gufo-voice-convert]
command = {app_d}\gufo.exe
args = serve voice
model = {modelle}\voiceconv
served-model-name = gufo-voice-convert
max-request-bytes = 67108864
threads = 8
device = gpu
router-gpu-gb = 2
router-host-gb = 4
router-idle-seconds = 120
