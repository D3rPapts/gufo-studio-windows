# baustein: video
# modell: wan2.2-ti2v-5b
# Wan 2.2 TI2V-5B (Apache-2.0): text/image to video, 24 fps, no sound. Measured: 480x480 1 s 20 steps 54 s;
# 1280x704 5 s 50 steps 39 min; GPU up to ~15 GiB. rife-model: RIFE frame interpolation ("gufo":{"interpolate":{"fps":60}}).
[external/wan2.2-ti2v-5b]
command = {app}\gufo.exe
args = serve video
model = {modelle}\Wan-AI\Wan2.2-TI2V-5B-Diffusers
root = {daten}\video-jobs-wan
rife-model = {modelle}\rife\weights\rife49.safetensors
ttl = 86400
max-request-bytes = 67108864

# baustein: video
# modell: wan2.1-uni3c
# Wan 2.1 I2V 14B + Uni3C camera moves (MoGe-2 depth -> point cloud -> guide video). first_frame plus
# "gufo":{"camera":{"type":"orbit_left","speed":1}}. 5 s 832x480 ~5.6 min, GPU ~27 GiB. The folder's gufo-camera.json
# points at Wan 2.2's T5, so this needs wan2.2-ti2v-5b too.
[external/wan2.1-uni3c]
command = {app}\gufo.exe
args = serve video
model = {modelle}\wan21-camera
root = {daten}\video-jobs-camera
rife-model = {modelle}\rife\weights\rife49.safetensors
ttl = 86400
max-request-bytes = 67108864

# baustein: video
# modell: wan2.1-infinitetalk-14b
# Wan 2.1 InfiniteTalk 14B (Apache-2.0): lip-sync from audio, up to two speakers (max 832x480). gufo-talk.json
# points at the Wan 2.1 I2V folder and LoRA under wan21-camera and at Wan 2.2's T5.
[external/wan2.1-infinitetalk-14b]
command = {app}\gufo.exe
args = serve video
model = {modelle}\wan21-talk
root = {daten}\video-jobs-talk
rife-model = {modelle}\rife\weights\rife49.safetensors
ttl = 86400
max-request-bytes = 134217728

# baustein: video
# modell: minimax-h3
# MiniMax H3 FL2VA (Community License, gated): text/first frame to video with stereo audio. Measured: 5 s fast 295 s,
# Turbo + first frame 5 s 274 s; peak GPU 31.5 GB dedicated + 15.5 GB shared, host RAM down to ~3 GB: nothing else may
# run beside it. Turbo LoRA: "gufo":{"lora":"turbo"} (use preset exact with Turbo). The manifest ships in bin\.
[external/minimax-h3]
command = {app}\gufo.exe
args = serve video
model = {modelle}\MiniMaxAI\MiniMax-H3
root = {daten}\video-jobs
manifest = {app}\MINIMAX_H3_FL2VA_BF16.source-manifest.json
lora = turbo={modelle}\lightx2v\Minimax-h3-Turbo\minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors,steps=8
vision-projector = {modelle}\MiniMaxAI\MiniMax-H3-vision\mmproj-BF16.gguf
rife-model = {modelle}\rife\weights\rife49.safetensors
ttl = 86400
max-request-bytes = 67108864
