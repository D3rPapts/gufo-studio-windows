# baustein: werkzeuge
# modell: gufo-upscale
# Real-ESRGAN (BSD-3-Clause) on the GPU: POST /v1/images/upscale and /v1/videos/upscale, variant general | wdn | anime,
# scale 2 or 4. Small model (~1 GB GPU).
[external/gufo-upscale]
command = {app}\gufo.exe
args = serve upscale --device gpu --model wdn={modelle}\upscale\realesr-general-wdn-x4v3.safetensors --model anime={modelle}\upscale\realesr-animevideov3.safetensors
model = {modelle}\upscale\realesr-general-x4v3.safetensors
served-model-name = gufo-upscale
max-request-bytes = 134217728
router-gpu-gb = 1
router-host-gb = 1

# baustein: werkzeuge
# modell: gufo-rife
# RIFE 4.9 frame interpolation as its own video worker (POST /v1/videos with interpolate only). The production section
# points model/manifest at the MiniMax H3 folder, so this needs the video module with minimax-h3.
[external/gufo-rife]
command = {app}\gufo.exe
args = serve video
model = {modelle}\MiniMaxAI\MiniMax-H3
root = {daten}\video-jobs-rife
manifest = {app}\MINIMAX_H3_FL2VA_BF16.source-manifest.json
rife-model = {modelle}\rife\weights\rife49.safetensors
ttl = 86400
max-request-bytes = 67108864
router-gpu-gb = 4
router-host-gb = 2

# baustein: werkzeuge
# modell: qwen3-omni-captioner
# Qwen3-Omni-30B-A3B-Captioner: describes audio (OpenAI input_audio, base64 WAV). Runs inside the router itself
# (needs the fork's `gufo serve omni`). GPU ~20 GB when loaded.
[omni/qwen3-omni-captioner]
model = {modelle}\mradermacher\Qwen3-Omni-30B-A3B-Captioner-GGUF\Qwen3-Omni-30B-A3B-Captioner.Q4_K_M.gguf
mmproj = {modelle}\mradermacher\Qwen3-Omni-30B-A3B-Captioner-GGUF\Qwen3-Omni-30B-A3B-Captioner.mmproj-f16.gguf
max-request-bytes = 67108864
