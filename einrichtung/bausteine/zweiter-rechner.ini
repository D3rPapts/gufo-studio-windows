# baustein: zweiter-rechner
# modell: {id}
# Twin of the local section on the partner router (same id there). placement = pool: both machines share the
# queue; POST /router/placement {"model":..,"placement":"local"|"remote"} switches at runtime. einrichten.py writes
# one block per model the partner has. pool-wait-seconds (2.0.2, optional): how long a pool request waits on the
# partner before it runs here (default 60).
[remote/{id}]
url = {partner}
placement = pool
pool-wait-seconds = {pool_wait?}
