erkl.kurz = In short
erkl.k1.html = <b>Merged?</b> Only half. Each router keeps its own job list and <code>jobs.json</code>; the machine a job was sent to stays its <b>owner</b> (result, files, progress). Shared are the order (oldest job of both machines first) and the computing: a free machine pulls the oldest waiting job of the other (<code>POST /router/pool/pull</code>, jobs.cpp:2734–2736), and a pool model goes, per request, to whichever machine is free (pool.hpp:105–151).
erkl.k2.html = <b>How much fits?</b> The queue has no upper limit. At the same time each router runs at most as many jobs as <code>--jobs-parallel</code> allows (on the .198: 2; default 1, router.cpp:3584), and per pool model a router sends only one request at a time to the other (pool.hpp:49). In practice each machine runs one big GPU model at a time, the rest waits.
erkl.k3.html = <b>Failure?</b> The other machine carries on alone. Waiting jobs of the failed machine stay in its <code>jobs.json</code> and only continue after it restarts – the other machine cannot take them over.
erkl.einzeln = In detail (from the code, gufo 2.0-int)
erkl.e1.html = <b>Noticing:</b> Each router probes the other every 5 s (2 s limit). If it does not answer, requests to it return <code>503 remote_unavailable</code> at once (router.cpp:128, 2281–2308), and the pool computes everything itself – even while GPU work runs here (pool.hpp:113–121: a machine that is gone holds nothing back).
erkl.e2.html = <b>Jobs of the failed machine:</b> On restart the router reads <code>jobs.json</code>. Waiting jobs go back into the queue (jobs.cpp:2682–2684). Running ones are <b>not</b> re-run but marked failed with <code>router_restarted</code> (jobs.cpp:2685–2696). Note: with <code>--jobs-parallel 2</code> a job is "running" at once, even when it only waits in the pool for a machine – such a job also ends as failed after a restart.
erkl.e3.html = <b>A job the failed machine was computing for the other</b> (pulled, or sent there by the pool): the owner gets no answer → <code>503 remote_unavailable</code> → the job goes <b>once</b> back to the front of its queue and is computed again at the owner (jobs.cpp:3410–3432). Video, music and 3D jobs the worker had already accepted are not repeated; they fail.
erkl.e4.html = <b>If the owner fails</b> while the other computes its job: the puller asks every 2 s; after 5 failed tries it gives up (<code>pool_pull_lost</code>, jobs.cpp:2944–2955) and takes its own jobs again. The result does not reach the owner.
erkl.e5.html = <b>Both busy:</b> a request waits in the pool at most 900 s (<code>queue-timeout-seconds</code>), then <code>503 pool_busy</code> (router.cpp:1813–1836). A job then goes back into the queue once; the second time it fails.
erkl.e6.html = <b>Redirect:</b> if a job waits in the pool and the other machine pulls it, the waiting request gets <code>503 pool_redirected</code> and the owner sends it again with <code>X-Gufo-Pool: remote</code> (router.cpp:1681–1697). Anything already at a worker is never redirected – nothing runs twice.
erkl.e7.html = <b>Placement</b> (local/remote/pool) is not saved; after a restart the preset applies again.
erkl.schwach = Known weaknesses (pool analysis 12.11.) and what 2.0.2 brings
erkl.b1.html = <b>B1</b> The LoRA "winkel" from the <code>;</code> line was not recognised → <code>400 no_capable_router</code> on both machines; the <code>X-Gufo-Pool</code> header was silently overridden. <b>2.0.2:</b> all LoRAs read (pool.hpp:162), the header wins.
erkl.b2.html = <b>B2</b> When the other answered 502/503/504, the user got the error although this machine was free. <b>2.0.2:</b> try here once and hold the other for that model for 60 s (pool.hpp:59, router.cpp:1764–1795).
erkl.b3.html = <b>B3</b> Mutual waiting up to 900 s: waiting requests counted as "busy", and jobs were pulled as soon as a job slot was free, even with a full GPU. <b>2.0.2:</b> "busy" and "waiting" reported apart (pool.hpp:194), pull only with a free GPU (jobs.cpp:2859).
erkl.b4.html = <b>B4</b> A model that could not load here at the moment was still pulled. <b>2.0.2:</b> <code>available:false</code> in <code>/router/capabilities</code>, pulls honour it.
erkl.offen.html = <b>B5 (2.0.2, "never stuck"):</b> unreachable partner → local at once; a request waiting for or pinned to the partner falls back to local after <code>pool-wait-seconds</code> (default 60 s), the 900 s limit is only the emergency brake; counter <code>fallbacks</code> in the status. <b>Open:</b> B6 distribution without looking at free memory (the .56 often pushes qwen-image to the tighter .198), B7 a load failure blocks up to 10 min, B8 wrong name "0.0.0.0" when handing over. Also: the film work of the .56 mostly goes direct or through ComfyUI, not through the job list – pull and push hardly reach it; only the per-request pool decision applies there.
erkl.fix.html = The cards above show whether a router has the 2.0.2 state (detected by the <code>available</code> field in <code>/router/capabilities</code>).
