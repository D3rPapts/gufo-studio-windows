; hint line per model: quality and licence
hinweis.fish-drama-3 = Fish Audio Drama-3 (30B, 44.1 kHz): best quality; licence: commercial use up to US$ 500,000 annual revenue. Expression comes from the text and the sample; switch speakers with <|speaker:1|> in the text. Runs on the second machine (39 GB).
hinweis.indextts-2.5-german = IndexTTS 2.5 with German fine-tune (22 kHz): eight emotions, German only; cloning needs a clean sample of up to 10 s. Licence: bilibili model licence, commercial use allowed.
hinweis.voxcpm2-tts = VoxCPM2 (OpenBMB, 48 kHz, Apache-2.0): style and emotion as free text, cloning from a sample (better with its words); it reads the language from the text.
hinweis.ming-tts = Ming-3.0-tts 0.5B (MIT, 44.1 kHz): winner of the listening test on 2 Nov; per request either emotion, style or rate/pitch/volume; cloning from a sample without its words.
hinweis.qwen3-tts = Qwen3-TTS 1.7B (24 kHz): nine preset voices, fast, but the weakest quality in this list.
hinweis.qwen3-tts-voicedesign = Qwen3-TTS VoiceDesign (24 kHz): voice from a description; quality like Qwen3-TTS.
hinweis.qwen3-tts-clone = Qwen3-TTS Base (24 kHz): cloning from a sample of up to 30 s with its words; quality like Qwen3-TTS.
