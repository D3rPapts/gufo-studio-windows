[bild]
seitentitel = gufo image generator
titel = gufo image generator
sub.html = Sends the prompt to the gufo router. The router keeps only one model loaded: while an image is being made, the 27B is unloaded and the next text request loads it again (about 15 s).<br><b>Qwen-Image</b>: can also edit with up to 10 reference images. <b>Fast (Turbo)</b>: Qwen-Image Turbo, always 8 steps, about 4 to 5 times faster (non-commercial use only). <b>MOSS-Image</b>: place elements with boxes.
