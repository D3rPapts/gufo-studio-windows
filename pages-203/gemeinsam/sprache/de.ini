; Hinweiszeile je Modell: Qualität und Lizenz (Fish: KB 1126; IndexTTS: bilibili-Lizenz, docs/models/indextts; VoxCPM2 Apache-2.0; Ming MIT)
hinweis.fish-drama-3 = Fish Audio Drama-3 (30B, 44,1 kHz): beste Qualität; Lizenz: kommerziell bis 500 000 US$ Jahresumsatz. Betonung kommt aus Text und Probe; Sprecherwechsel mit <|speaker:1|> im Text. Läuft auf der zweiten Maschine (39 GB).
hinweis.indextts-2.5-german = IndexTTS 2.5 mit deutschem Feintuning (22 kHz): acht Gefühle, nur Deutsch; Klon braucht eine saubere Probe bis 10 s. Lizenz: bilibili-Modelllizenz, kommerziell erlaubt.
hinweis.voxcpm2-tts = VoxCPM2 (OpenBMB, 48 kHz, Apache-2.0): Stil und Gefühl als freier Text, Klon mit Probe (besser mit Wortlaut); die Sprache liest es aus dem Text.
hinweis.ming-tts = Ming-3.0-tts 0.5B (MIT, 44,1 kHz): Gewinner des Hörtests vom 02.11.; je Anfrage entweder Gefühl, Stil oder Tempo/Tonhöhe/Lautstärke; Klon aus Probe ohne Wortlaut.
hinweis.qwen3-tts = Qwen3-TTS 1.7B (24 kHz): neun feste Stimmen, schnell, aber die schwächste Qualität im Vergleich.
hinweis.qwen3-tts-voicedesign = Qwen3-TTS VoiceDesign (24 kHz): Stimme aus einer Beschreibung; Qualität wie Qwen3-TTS.
hinweis.qwen3-tts-clone = Qwen3-TTS Base (24 kHz): Klon mit Probe bis 30 s und Wortlaut; Qualität wie Qwen3-TTS.
