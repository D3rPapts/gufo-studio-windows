layout.hinweis = Im Feld ziehen = neuer Kasten. Kasten ziehen = verschieben, Ecke unten rechts = Größe ändern. Für jeden Kasten: Art, Beschreibung und bei Text den genauen Schriftzug. Ohne Kästen gilt nur der normale Prompt; mit Kästen ist der Prompt die Gesamtbeschreibung.
