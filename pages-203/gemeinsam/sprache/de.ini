; ausgegrauten Felder (<modell>.<feld>). "schluessel = Text"; Schlüssel auf ".html" dürfen <b>, <br>, <a>, <code> enthalten;
; {name} = Platzhalter; Wert in "…" behält Leerzeichen am Rand. Siehe gemeinsam/sprache.js.

