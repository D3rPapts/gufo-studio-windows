summen.hinweis = „wartend“ und „fertig/Fehler“ zählen beim Besitzer (dem Rechner, an den der Auftrag ging), „laufend“ dort, wo gerechnet wird. „wartend“ umfasst auch Aufträge, die schon gestartet sind, aber im Pool auf einen freien Rechner warten.
