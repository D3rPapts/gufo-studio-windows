; Klartext-Fehler und „Nochmal“ (gemeinsam/auftraege.js, 11.11.)
fehler.netz = Router nicht erreichbar.
fehler.507 = Nicht genug Speicher auf diesem Rechner – ein anderes Modell ist noch geladen oder der Rechner ist voll. Nochmal versuchen hilft oft nach ein paar Minuten.
fehler.503 = Modell lädt gerade oder der andere Rechner ist beschäftigt – bitte kurz warten.
fehler.404 = Dieser Router nimmt gerade keine Aufträge an (Wartungspause oder ohne Auftragsliste --jobs-dir). Bitte später erneut versuchen oder den anderen Rechner wählen.
