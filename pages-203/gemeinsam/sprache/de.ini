jobs.hinweis.html = Position = Reihenfolge aller wartenden Aufträge beider Rechner, wie der Router sie bildet (2.0.3): zuerst nach Vorrang (Prio 9 … 1, „–“ = normal), bei gleichem Vorrang nach Eingangszeit (1 = kommt als Nächstes). Den Vorrang wählt man auf den Seiten beim Abschicken (Feld „Vorrang“: normal / hoch 5 / sofort 9). Mit <code>--jobs-parallel 2</code> beginnt die Laufzeit schon, wenn ein Auftrag in den Pool geht; die Wartezeit im Pool steckt dann in der Laufzeit.
h.faehig = Was kann welcher Rechner?
nur.pool = nur Pool-Modelle
legende = kann · geladen · belegt · wartet · Fehler
sp.platz = Platz
hier = hier
partner = Partner
sp.loras = LoRAs
h.ausfall = Was passiert, wenn ein Rechner ausfällt?
erkl.kurz = Kurz gesagt
erkl.k1.html = <b>Zusammengelegt?</b> Nur halb. Jeder Router hat seine eigene Auftragsliste und Datei <code>jobs.json</code>; der Rechner, an den ein Auftrag geschickt wurde, bleibt sein <b>Besitzer</b> (Ergebnis, Dateien, Fortschritt). Gemeinsam sind die Reihenfolge (ältester Auftrag beider Rechner zuerst) und das Rechnen: ein freier Rechner holt sich den ältesten wartenden Auftrag des anderen (<code>POST /router/pool/pull</code>, jobs.cpp:2734–2736), und ein Pool-Modell geht je Anfrage an den Rechner, der frei ist (pool.hpp:105–151).
erkl.k2.html = <b>Wie viel passt rein?</b> Die Warteschlange hat keine Obergrenze. Gleichzeitig rechnen je Router höchstens so viele Aufträge, wie <code>--jobs-parallel</code> erlaubt (auf der .198: 2; Standard 1, router.cpp:3584), und je Pool-Modell schickt ein Router nur eine Anfrage zur Zeit an den anderen (pool.hpp:49). Praktisch rechnet jeder Rechner ein großes GPU-Modell zur Zeit, der Rest wartet.
erkl.k3.html = <b>Ausfall?</b> Der andere Rechner macht allein weiter. Wartende Aufträge des ausgefallenen Rechners liegen in seiner <code>jobs.json</code> und laufen erst nach seinem Neustart weiter – der andere kann sie nicht übernehmen.
erkl.einzeln = Im Einzelnen (aus dem Code, gufo 2.0-int)
erkl.e1.html = <b>Merken:</b> Jeder Router fragt den anderen alle 5 s ab (2 s Zeitgrenze). Antwortet er nicht, gehen Anfragen an ihn sofort mit <code>503 remote_unavailable</code> zurück (router.cpp:128, 2281–2308), und der Pool rechnet alles selbst – auch wenn hier gerade GPU-Arbeit läuft (pool.hpp:113–121: ein Rechner, der weg ist, hält nichts zurück).
erkl.e2.html = <b>Aufträge des Ausgefallenen:</b> Beim Neustart liest der Router <code>jobs.json</code>. Wartende Aufträge kommen zurück in die Warteschlange (jobs.cpp:2682–2684). Laufende werden <b>nicht</b> neu gerechnet, sondern als Fehler <code>router_restarted</code> markiert (jobs.cpp:2685–2696). Achtung: Mit <code>--jobs-parallel 2</code> steht ein Auftrag sofort auf „läuft“, auch wenn er nur im Pool auf einen Rechner wartet – auch so einer endet nach einem Neustart als Fehler.
erkl.e3.html = <b>Auftrag, den der Ausgefallene gerade für den anderen rechnete</b> (geholt oder vom Pool hingeschickt): Der Besitzer bekommt keine Antwort → <code>503 remote_unavailable</code> → der Auftrag geht <b>einmal</b> an den Anfang seiner Warteschlange und wird dann beim Besitzer neu gerechnet (jobs.cpp:3410–3432). Video, Musik und 3D, die der Worker schon angenommen hatte, werden nicht wiederholt, sondern schlagen fehl.
erkl.e4.html = <b>Fällt der Besitzer aus,</b> während der andere seinen Auftrag rechnet: Der Holende fragt alle 2 s nach; nach 5 Fehlversuchen gibt er auf (<code>pool_pull_lost</code>, jobs.cpp:2944–2955) und nimmt wieder eigene Aufträge. Das Ergebnis kommt beim Besitzer nicht an.
erkl.e5.html = <b>Beide belegt:</b> Eine Anfrage wartet im Pool höchstens 900 s (<code>queue-timeout-seconds</code>), dann <code>503 pool_busy</code> (router.cpp:1813–1836). Ein Auftrag geht danach einmal zurück in die Warteschlange, beim zweiten Mal ist er ein Fehler.
erkl.e6.html = <b>Umleiten:</b> Wartet ein Auftrag im Pool und der andere Rechner holt ihn, bekommt die wartende Anfrage <code>503 pool_redirected</code>, und der Besitzer schickt sie mit <code>X-Gufo-Pool: remote</code> neu (router.cpp:1681–1697). Was schon beim Worker ist, wird nie umgeleitet – nichts läuft doppelt.
erkl.e7.html = <b>Platzierung</b> (local/remote/pool) wird nicht gespeichert; nach einem Neustart gilt wieder das Preset.
erkl.schwach = Bekannte Schwächen (Pool-Analyse 12.11.) und was 2.0.2 bringt
erkl.b1.html = <b>B1</b> Die LoRA „winkel“ aus der <code>;</code>-Zeile wurde nicht erkannt → <code>400 no_capable_router</code> auf beiden Rechnern; der Kopf <code>X-Gufo-Pool</code> wurde still überschrieben. <b>2.0.2:</b> alle LoRAs gelesen (pool.hpp:162), der Kopf gewinnt.
erkl.b2.html = <b>B2</b> Antwortete der andere mit 502/503/504, bekam der Nutzer den Fehler, obwohl hier frei war. <b>2.0.2:</b> einmal hier versuchen und den anderen 60 s für das Modell sperren (pool.hpp:59, router.cpp:1764–1795).
erkl.b3.html = <b>B3</b> Gegenseitiges Warten bis 900 s: wartende Anfragen galten als „belegt“, und geholt wurde, sobald ein Auftrags-Platz frei war, auch bei voller GPU. <b>2.0.2:</b> „busy“ und „waiting“ getrennt (pool.hpp:194), Holen nur bei freier GPU (jobs.cpp:2859).
erkl.b4.html = <b>B4</b> Geholt wurde auch ein Modell, das hier gerade nicht laden konnte. <b>2.0.2:</b> <code>available:false</code> in <code>/router/capabilities</code>, Holen beachtet das.
erkl.offen.html = <b>B5 (2.0.2, „nie stuck“):</b> Partner nicht erreichbar → sofort lokal; ein Auftrag, der auf den Partner wartet oder an ihn gebunden ist, fällt nach <code>pool-wait-seconds</code> (Vorgabe 60 s) auf lokal zurück, 900 s sind nur Notbremse; Zähler <code>fallbacks</code> im Status. <b>Offen:</b> B6 Verteilung ohne Blick auf freien Speicher (die .56 schiebt qwen-image oft auf die knappere .198), B7 ein Ladefehler blockiert bis 10 min, B8 falscher Name „0.0.0.0“ beim Abgeben. Und: Die Filmarbeit der .56 geht meist direkt oder über ComfyUI, nicht über die Auftragsliste – Holen und Abgeben erreichen sie kaum, dort wirkt nur die Pool-Entscheidung je Anfrage.
erkl.fix.html = Die Karten oben zeigen, ob ein Router den 2.0.2-Stand hat (erkannt am Feld <code>available</code> in <code>/router/capabilities</code>).
