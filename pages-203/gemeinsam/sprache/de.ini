[bild]
seitentitel = gufo Bildgenerator
titel = gufo Bildgenerator
sub.html = Schickt den Prompt an den gufo-Router. Der Router lädt immer nur ein Modell: Während ein Bild entsteht, ist das 27B ausgeladen, die nächste Text-Anfrage lädt es wieder (etwa 15 s).<br><b>Qwen-Image</b>: auch Bearbeiten mit bis zu 10 Referenzbildern. <b>Schnell (Turbo)</b>: Qwen-Image Turbo, immer 8 Schritte, etwa 4- bis 5-mal schneller (nur nicht kommerziell). <b>MOSS-Image</b>: Elemente per Kasten platzieren.
feld.modell = Modell
feld.groesse = Größe
modell.turbo = Schnell (Turbo)
feld.schritte = Schritte
refs.titel = Bearbeiten / Referenzbilder (optional)
refs.hinweis = Mit Bildern wird der Prompt zur Anweisung, z. B. „Mach den Himmel zu einem Sonnenuntergang“ oder „Setze die Figur aus Bild 1 in die Szene aus Bild 2“. Bis zu 10 Bilder, zusammen höchstens 20 MB. Ein Ergebnis unten kann mit „Weiter bearbeiten“ als Referenz übernommen werden.
refs.entfernen = Bilder entfernen
init.titel = Startbild bearbeiten: Maske und Teilstärke (optional)
init.hinweis = Ein Bild wählen und die Stellen übermalen, die neu entstehen sollen; alles andere bleibt wie im Original (Maske: Qwen-Image und Turbo). Ohne Maske wandelt „Teilstärke“ unter 1 das ganze Bild ab (Bild zu Bild, nur Qwen-Image 2.1). Die Größe kommt dann vom Startbild (auf 32 px gerundet). Referenzbilder oben bleiben zusätzlich Referenzen.
init.bild = Startbild
maske.pinsel = Pinsel
maske.malen = Malen
